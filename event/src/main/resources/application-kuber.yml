spring:
  datasource:
    username: event_message
    password: secretpassevent
    url: jdbc:postgresql://localhost:5432/exchange_event
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    generate-ddl: false
#    h2:
#      console:
#        enable: false


eureka:
  client:
    service-url:
      defaultZone: http://discovery:8761/eureka
    enabled: true
  instance:
    metadata-map:
      versions: ${version}
      metrics.path: /event/actuator/prometheus
      health.path: /event/actuator/health
      context-path: /event
      management.context-path: /event
    hostname: event
    appname: event