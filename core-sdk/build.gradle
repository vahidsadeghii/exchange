plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

configurations {
    sbeTool
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //jakarta
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Guava
    implementation libs.guava

    // ---- Aeron (High-performance messaging) ----
    implementation 'io.aeron:aeron-all:1.52.1'
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


sourceSets {
    main {
        java {
            srcDir "$rootDir/me/build/generated-src/sbe"
            srcDir "$rootDir/wallet/build/generated-src/sbe"
        }
    }
}

compileJava.dependsOn ':me:generateSbe'
compileJava.dependsOn ':wallet:generateSbe'

tasks.named('test') {
    useJUnitPlatform()
}
