version: '3.8'
services:


  # ---------------- Microservices ----------------
  gateway:
    image: gateway:latest
    container_name: gateway
    restart: always
    ports:
      - "8070:8070"
    environment:
      SPRING.PROFILES.ACTIVE: development
      eureka.client.serviceUrl.defaultZone: http://discovery:8761/eureka
      spring.data.redis.host: redis
      eureka.instance.hostname: gateway
      eureka.instance.prefer.ip.address: "false"
      eureka.instance.metadata-map.prometheus.path: gateway/actuator/prometheus
    networks:
      - exchange-network

  # ---------------- Eureka Discovery ----------------
  discovery:
    image: discovery:latest
    container_name: discovery
    restart: always
    networks:
      - exchange-network

    ports:
      - "8761:8761"
    #network_mode: "host"
  # ----------------Keyclok ----------------user: admin pass: admin
  #  keycloak:
  #    image: quay.io/keycloak/keycloak:21.1.1
  #    container_name: keycloak
  #    environment:
  #      KEYCLOAK_ADMIN: admin
  #      KEYCLOAK_ADMIN_PASSWORD: admin
  #    command: start-dev
  #    restart: unless-stopped
  #    ports:
  #      - "8080:8080"
  #    networks:
  #      - exchange-network

  # ---------------- MongoDB ----------------
  mongodb:
    container_name: mongodb
    image: mongo:latest
    volumes:
      - /media/homa/home2/docker/mongodb:/data/db
      - /mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    ports:
      - "27017:27017"
    restart: always
    #entrypoint: ["/usr/bin/mongod", "--bind_ip_all", "--replSet", "dbrs"]
    cpus: 2
    mem_limit: 2048m
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: kJ745U659
      MONGO_INITDB_DATABASE: test
    networks:
      - exchange-network
    #network_mode: "host"

  # ----------------postgres ----------------
  #  postgresql:
  #    container_name: postgres
  #    image: postgres
  #    restart: always
  #    network_mode: "host"
  #    environment:
  #      POSTGRES_PASSWORD: postgress
  #    volumes:
  #      - pgdata:/var/lib/postgresql/data


  # ---------------- Prometheus ----------------
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - exchange-network
    restart: unless-stopped

  # ---------------- Grafana ----------------
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - exchange-network
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana



  # ---------------- Redis ----------------
  redis:
    image: redis:6.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - /media/homa/home2/docker/redis:/data
    networks:
      - exchange-network




  # ---------------- Kafka ----------------
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    #network_mode: host
    restart: always
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
    networks:
      - exchange-network
    environment:
      - KAFKA_KRAFT_MODE=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

    volumes:
      - kafka_data:/bitnami/kafka

  # ---------------- Redpanda Console:Kafka ----------------
  console:
    image: vectorized/console:latest
    container_name: kafka-console
    networks:
      - exchange-network
    restart: always
    environment:
      KAFKA.BROKERS: kafka:9092
      KAFKA.CONNECT.ENABLED: "false"
      SERVER.LISTEN.ADDRESS: 0.0.0.0:8080
    ports:
      - "7080:8080"

  # ---------------- Microservices ----------------


  profile:
    image: profile:latest
    container_name: profile
    restart: always
    ports:
      - "8091:8091"
    environment:
      SPRING.PROFILES.ACTIVE: docker

      # PostgreSql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exchange_user_profile
      SPRING_DATASOURCE_USERNAME: user_profile
      SPRING_DATASOURCE_PASSWORD: secretpassuserprofile
      # eureka.client.serviceUrl.defaultZone: http://discovery:8761/eureka
      spring.kafka.bootstrap-servers: "kafka:9092"
      eureka.instance.hostname: profile
      eureka.instance.prefer.ip.address: "false"
      eureka.instance.metadata-map.prometheus.path: profile/actuator/prometheus
    networks:
      - exchange-network

  emailmanager:
    image: emailmanager:latest
    container_name: emailmanager
    restart: always
    depends_on:
      - kafka
      # - discovery
    ports:
      - "8092:8092"
    environment:
      SPRING.PROFILES.ACTIVE: docker
      #eureka.client.serviceUrl.defaultZone: http://discovery:8761/eureka
      spring.kafka.bootstrap-servers: "kafka:9092"
      eureka.instance.hostname: emailmanager
      eureka.instance.prefer.ip.address: "false"
      eureka.instance.metadata-map.prometheus.path: emailmanager/actuator/prometheus
    networks:
      - exchange-network

  wallet:
    image: exchange-wallet:latest
    container_name: wallet
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_INSTANCE_HOSTNAME: wallet
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_METADATA_MAP_PROMETHEUS_PATH: wallet/actuator/prometheus
    networks:
      - exchange-network

  oms:
    image: exchange-oms:latest
    container_name: oms
    restart: always
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      # PostgreSql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exchange_oms
      SPRING_DATASOURCE_USERNAME: user_oms
      SPRING_DATASOURCE_PASSWORD: secretpassoms

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_INSTANCE_HOSTNAME: oms
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_METADATA_MAP_PROMETHEUS_PATH: oms/actuator/prometheus
    networks:
      - exchange-network

  me:
    image: exchange-me:latest
    container_name: me
    restart: always
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_INSTANCE_HOSTNAME: me
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_METADATA_MAP_PROMETHEUS_PATH: me/actuator/prometheus
    networks:
      - exchange-network

  event:
    image: exchange-event:latest
    container_name: event
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_INSTANCE_HOSTNAME: event
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_METADATA_MAP_PROMETHEUS_PATH: event/actuator/prometheus
    networks:
      - exchange-network

volumes:
  cache:
    driver: local
  my-volume:
  kafka_data:
  grafana-data:
  pgdata:
  metabase-data:
    driver: local

networks:
  exchange-network:
    external: true