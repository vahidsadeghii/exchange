server:
  port: 8088
  shutdown: graceful
  servlet:
    context-path: /profile

api:
  version: v1
  prefix:
    secure: /api/${api.version}
    open: /open/${api.version}
    internal: /_api/${api.version}

spring:
  application:
    name: profile


  cloud:
    config:
      enabled: false

  kafka:
    consumer:
      group-id: profile
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
#
#eureka:
#  instance:
#    metadata-map:
#      prometheus.path: /profile/actuator/prometheus
#      context.path: /profile



springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html



management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    prometheus:
      enabled: true

custom-config:
  kafka:
    sendmessage-output-message:
      topic: send-message
    event-output-message:
      topic: event-topic
    verification-output-message:
      topic: email-verification-topic

keycloak:
  realm: admin-exchange
  auth-server-url: http://localhost:8080
  client-id: exchange-management
  client-secret: 3j8ultDup3u5v4nxczkm5lco65NL0aXX



logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG


resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 20
        minimum-number-of-calls: 2
        sliding-window-size: 5
        wait-duration-in-open-state: 1000
        maxRetryAttempts: 4
        waitDuration: 1000
        ignoreExceptions: com.exchange.profile.config.feign.FeignException
    instances:
      profile-instance:
        baseConfig: default

  retry:
    configs:
      default:
        maxRetryAttempts: 4
        waitDuration: 1000
        ignoreExceptions: com.exchange.profile.config.feign.FeignException
    instances:
      profile-instance:
        base-config: default